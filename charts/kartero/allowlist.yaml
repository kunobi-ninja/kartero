# Reviewed metric and attribute registry. A name that matches nothing here is
# dropped, never forwarded.
#
# Names can be admitted one at a time under `metrics` / `attributes`, or by
# family under `metric_patterns` / `attribute_patterns`. Patterns are regular
# expressions, anchored to the whole name: `ci\..+` cannot match
# `anything.ci.whatever`, and an author's own `^`/`$` are harmless.
#
# A pattern trades review for ergonomics. Admitting `ci\..+` means a producer
# can open a new `ci.*` series without anyone approving that specific name, and
# a family listed here should be one whose namespace is already owned by a
# trusted producer. What patterns do not relax is attribute *values*: an
# unbounded value costs a series per run, and `attribute_values` below is the
# only thing standing between a vocabulary and that bill.

metric_patterns:
  # Benchmark and daemon telemetry from kache.
  - 'kache\.(bench|cache|prefetch|ci)\..+'
  # Pipeline telemetry from any collected repository.
  - 'ci\.(run|job|coverage|collector)\..+'

metrics: []

attribute_patterns:
  - 'kache\.(bench|cache|prefetch|telemetry)\..+'
  # Resource identity. `cicd.*` and `vcs.*` are absent on purpose: Kartero
  # stamps those from the trusted GitHub run and strips whatever arrived.
  - '(service|deployment|telemetry)\..+'

attributes:
  - cicd.pipeline.name
  - vcs.repository.url.full
  # Pipeline telemetry. Bare names with no namespace to group them, so each is
  # listed. That is the intended cost: an attribute key multiplies series, and
  # this is the surface where a careless one would be expensive.
  - language
  - kind
  - branch_class
  - repository
  - workflow_path
  - event
  - attempt_class
  - run_conclusion
  - conclusion
  - skip_reason
  - job_name
  - runner_pool
  - did_work
  - outcome
  - recovery
  - mode
  - anomaly

# Attributes whose values are checked as well as their keys. Only vocabularies
# fixed in a producer's code are listed: pinning one here means a change to it
# has to be reviewed before the new value can arrive.
#
# The keys left out are bounded by the producer rather than here — a job name
# comes from a reviewed alias table, a repository from this deployment's own
# source list. Kartero takes those on trust. Run ids, commit hashes, raw branch
# names, actor logins and runner names match nothing above, which is the
# stronger guarantee: they cannot be sent at all.
attribute_values:
  branch_class:
    - pull_request
    - trunk_dev
    - trunk_main
    - release_pre
    - other
  attempt_class:
    - first
    - rerun
  did_work:
    - "true"
    - "false"
  recovery:
    - recovered
    - still_failing
  outcome:
    - flake
    - revealed_failure
    - persistent_failure
    - rerun_of_green
    - superseded
    - after_cancelled
    - other

# Bench runs must name a project, and it must match. Unlike the vocabularies
# above this one is required rather than merely checked: a `kache.bench.*`
# point carrying no project, or one that matches nothing, is dropped.
#
# A family rather than a list. Enumerating them drifted — kache grew ten bench
# variants the list never learned, and each one rejected a whole artifact with
# "allowlist dropped every metric". A project name is chosen by whoever adds a
# bench rather than derived from a run, so the cardinality is bounded by how
# many benches exist.
project_patterns:
  - 'bench-.+'

projects: []
