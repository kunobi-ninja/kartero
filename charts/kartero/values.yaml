nameOverride: ""
fullnameOverride: ""

# Single replica: the ledger SQLite file is single-writer. The chart forces
# Recreate when persistence is a PVC, same reason as kache-service.
replicaCount: 1

image:
  repository: zondax/kartero
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

logLevel: "kartero=info"

github:
  owner: kunobi-ninja
  repo: kache
  workflows:
    - bench.yml
    - ci.yml
  trustedBranch: main
  artifactPrefix: telemetry-otlp-v1
  # Required Secret containing a fine-grained PAT with Actions: read and
  # Metadata: read. The chart references the Secret; External Secrets or
  # another platform controller owns its creation.
  existingSecret: kartero-github
  existingSecretKey: token

# Several repositories in one collector. Leave empty to use the single `github`
# block above; set it and `github` is ignored except for `artifactPrefix`.
#
# One instance means one ledger and one allowlist covering every source. That
# is the point: a second Deployment would need a second PVC, a second token to
# rotate and a second thing to watch. The allowlist stays global, so a metric
# name admitted for one repository is admitted for all of them.
#
# Each source needs its own Secret. A fine-grained token is scoped to the
# repositories it was minted for, so one token covering several is a decision
# about blast radius rather than a default.
sources: []
#  - owner: kunobi-ninja
#    repo: kache
#    workflows: [bench.yml, ci.yml]
#    trustedBranch: main
#    existingSecret: kartero-github-kache
#    existingSecretKey: token
#  - owner: kunobi-ninja
#    repo: kunobi-frontend
#    workflows: [ci.yaml]
#    trustedBranch: dev
#    existingSecret: kartero-github-kunobi-frontend
#    existingSecretKey: token

otlp:
  # In-cluster SigNoz collector. Override per environment.
  endpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
  # Optional. A URL that answers 2xx only while the store behind the collector
  # can take writes. Collect asks it at the start of each pass and before each
  # delivery. While it answers anything else, no collected data is sent or
  # recorded, and the next pass asks again. Empty turns the check off.
  #
  # Without it, a store outage loses what Kartero sends during it: a collector
  # answers 2xx once it has queued a body, then drops it if the store is down,
  # and Kartero has already recorded the artifact as delivered.
  #
  # For SigNoz, the query service checks ClickHouse at /api/v1/health?live=1.
  # With the release and namespace the endpoint above assumes, that is
  #   http://signoz.signoz.svc.cluster.local:8080/api/v1/health?live=1
  # (`kubectl -n signoz get svc` shows the name). Without `?live=1` it answers
  # 2xx while ClickHouse is down, and so does the collector's own health check.
  # The check sends no credentials, and the URL is logged as written, so keep
  # tokens out of it.
  readinessUrl: ""

# Optional on-cluster copy of diagnostic GitHub artifacts (kache `bench-*`
# zips). Off by default. Independent of OTLP collect: a failed archive pass
# does not skip metrics delivery. Uses its own PVC; the ledger PVC stays 1Gi.
archive:
  enabled: false
  artifactPrefix: bench
  maxBytes: 33554432
  # Days an archived file is kept. Unset keeps everything, which fills the
  # volume: bench artifacts are megabytes each and arrive nightly, and the pass
  # that fails when it is full is the one that would have archived that night.
  retentionDays: 30
  path: /var/lib/kartero-archive
  persistence:
    type: pvc
    size: 50Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

# Publish reviewed SigNoz queries as JSON to an S3-compatible bucket, such as
# Cloudflare R2. Off by default. Needs `sources`: queries have no environment
# form, so export is configured through the rendered file only.
#
# The queries live here, not in a SigNoz dashboard: what a public page shows
# then changes only through a reviewed change to these values. Each pass
# rewrites every document, so a failed pass is repaired by the next one.
export:
  enabled: false
  signoz:
    # The query service serving /api/v5/query_range, not the OTLP collector.
    endpoint: http://signoz.signoz.svc.cluster.local:8080
    # Secret holding a SigNoz service-account API key.
    existingSecret: kartero-signoz
    existingSecretKey: api-key
  store:
    # For R2: https://<account id>.r2.cloudflarestorage.com
    endpoint: ""
    bucket: ""
    region: auto
    # Secret holding an access key scoped to this bucket.
    existingSecret: kartero-export-store
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  jobs: []
  #  - name: kache-bench
  #    # Rewritten every pass.
  #    key: kache/bench/v1/latest.json
  #    # Optional. Written once per UTC day as well, so the history outlives
  #    # SigNoz's retention.
  #    snapshotKey: kache/bench/v1/days/{date}.json
  #    window: 90d
  #    step: 1d
  #    # Keep the bucket SigNoz has not closed yet. Right for a nightly
  #    # measurement, whose day is final once the night's run is in.
  #    includePartial: true
  #    cacheControl: "public, max-age=300"
  #    queries:
  #      # `spec` is a SigNoz v5 builder query, passed through. Kartero sets
  #      # `name` and `stepInterval`; each query has one aggregation.
  #      - id: build_duration
  #        spec:
  #          signal: metrics
  #          aggregations:
  #            - metricName: kache.bench.build.duration
  #              timeAggregation: avg
  #              spaceAggregation: avg
  #          filter:
  #            expression: "kache.bench.cache_tool = 'kache'"
  #          groupBy:
  #            - name: kache.bench.project
  #            - name: kache.bench.phase
  #          # SigNoz returns 100 series unless told otherwise.
  #          limit: 500

interval: 1h
heartbeatInterval: 1m
# How far back a pass lists runs, as a UTC date: 24h lists runs created since
# yesterday. Artifacts and derived metrics that wait for otlp.readinessUrl are
# retried only while their run is still listed, so widen this to catch up after
# a longer outage.
lookback: 24h

ledger:
  path: /var/lib/kartero/ledger.sqlite
  persistence:
    type: pvc
    mountPath: /var/lib/kartero
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

allowlist:
  mountPath: /etc/kartero
  # The reviewed metric and attribute registry for this deployment.
  #
  # Left empty the chart's own allowlist.yaml is used, which exists as a
  # working example rather than as anybody's policy. Set it to own what this
  # installation collects without waiting on a Kartero release — the names in
  # it describe the repositories being watched, not the collector.
  content: ""

  # allowlist:
  #   content: |
  #     metric_patterns:
  #       - 'ci\.(run|job)\..+'
  #     attributes:
  #       - branch_class
  #     project_patterns: []
  #     projects: []

# Where the rendered collector config lands when `sources` is set. Unused
# otherwise.
config:
  mountPath: /etc/kartero/config

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Sized for the payload, not the idle process, which sits around 2Mi. A parsed
# OTLP document is several times the size of its source, so the ceiling has to
# clear MAX_JSON_BYTES with room to re-serialise it.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

# Own telemetry reaches SigNoz two ways: scrape of /metrics (these
# annotations) and OTLP/HTTP posts to otlp.endpoint. Process heartbeat
# gauges are sent on heartbeatInterval; kartero.collect.* follows each
# collect pass. Logs are JSON on stdout for signoz-agents.
signoz:
  scrape: true
  path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
