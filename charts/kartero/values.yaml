nameOverride: ""
fullnameOverride: ""

# Single replica: the ledger SQLite file is single-writer. The chart forces
# Recreate when persistence is a PVC, same reason as kache-service.
replicaCount: 1

image:
  repository: zondax/kartero
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

logLevel: "kartero=info"

github:
  owner: kunobi-ninja
  repo: kache
  workflows:
    - bench.yml
    - ci.yml
  trustedBranch: main
  artifactPrefix: telemetry-otlp-v1
  # Required Secret containing a fine-grained PAT with Actions: read and
  # Metadata: read. The chart references the Secret; External Secrets or
  # another platform controller owns its creation.
  existingSecret: kartero-github
  existingSecretKey: token

otlp:
  # In-cluster SigNoz collector. Override per environment.
  endpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318

# Optional copy of diagnostic GitHub artifacts (kache `bench-*` zips) to an
# S3-compatible bucket. Off by default. Independent of OTLP collect: a
# failed archive pass does not skip metrics delivery.
archive:
  enabled: false
  artifactPrefix: bench
  bucket: ""
  keyPrefix: ""
  endpoint: ""
  region: auto
  maxBytes: 33554432
  existingSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

interval: 1h
heartbeatInterval: 1m

ledger:
  path: /var/lib/kartero/ledger.sqlite
  persistence:
    type: pvc
    mountPath: /var/lib/kartero
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

allowlist:
  mountPath: /etc/kartero

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Own telemetry reaches SigNoz two ways: scrape of /metrics (these
# annotations) and OTLP/HTTP posts to otlp.endpoint. Process heartbeat
# gauges are sent on heartbeatInterval; kartero.collect.* follows each
# collect pass. Logs are JSON on stdout for signoz-agents.
signoz:
  scrape: true
  path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
