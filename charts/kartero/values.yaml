nameOverride: ""
fullnameOverride: ""

# Single replica: the ledger SQLite file is single-writer. The chart forces
# Recreate when persistence is a PVC, same reason as kache-service.
replicaCount: 1

image:
  repository: zondax/kartero
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

logLevel: "kartero=info"

github:
  owner: kunobi-ninja
  repo: kache
  workflows:
    - bench.yml
    - ci.yml
  trustedBranch: main
  artifactPrefix: telemetry-otlp-v1
  # Required Secret containing a fine-grained PAT with Actions: read and
  # Metadata: read. The chart references the Secret; External Secrets or
  # another platform controller owns its creation.
  existingSecret: kartero-github
  existingSecretKey: token

# Several repositories in one collector. Leave empty to use the single `github`
# block above; set it and `github` is ignored except for `artifactPrefix`.
#
# One instance means one ledger and one allowlist covering every source. That
# is the point: a second Deployment would need a second PVC, a second token to
# rotate and a second thing to watch. The allowlist stays global, so a metric
# name admitted for one repository is admitted for all of them.
#
# Each source needs its own Secret. A fine-grained token is scoped to the
# repositories it was minted for, so one token covering several is a decision
# about blast radius rather than a default.
sources: []
#  - owner: kunobi-ninja
#    repo: kache
#    workflows: [bench.yml, ci.yml]
#    trustedBranch: main
#    existingSecret: kartero-github-kache
#    existingSecretKey: token
#  - owner: kunobi-ninja
#    repo: kunobi-frontend
#    workflows: [ci.yaml]
#    trustedBranch: dev
#    existingSecret: kartero-github-kunobi-frontend
#    existingSecretKey: token

otlp:
  # In-cluster SigNoz collector. Override per environment.
  endpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318

# Optional on-cluster copy of diagnostic GitHub artifacts (kache `bench-*`
# zips). Off by default. Independent of OTLP collect: a failed archive pass
# does not skip metrics delivery. Uses its own PVC; the ledger PVC stays 1Gi.
archive:
  enabled: false
  artifactPrefix: bench
  maxBytes: 33554432
  path: /var/lib/kartero-archive
  persistence:
    type: pvc
    size: 50Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

interval: 1h
heartbeatInterval: 1m

ledger:
  path: /var/lib/kartero/ledger.sqlite
  persistence:
    type: pvc
    mountPath: /var/lib/kartero
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

allowlist:
  mountPath: /etc/kartero

# Where the rendered collector config lands when `sources` is set. Unused
# otherwise.
config:
  mountPath: /etc/kartero/config

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Sized for the payload, not the idle process, which sits around 2Mi. A parsed
# OTLP document is several times the size of its source, so the ceiling has to
# clear MAX_JSON_BYTES with room to re-serialise it.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

# Own telemetry reaches SigNoz two ways: scrape of /metrics (these
# annotations) and OTLP/HTTP posts to otlp.endpoint. Process heartbeat
# gauges are sent on heartbeatInterval; kartero.collect.* follows each
# collect pass. Logs are JSON on stdout for signoz-agents.
signoz:
  scrape: true
  path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
