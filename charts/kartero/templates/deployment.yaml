apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kartero.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kartero.labels" . | nindent 4 }}
spec:
{{- if eq .Values.ledger.persistence.type "pvc" }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "ledger.persistence.type=pvc is single-writer: replicaCount must be 1" }}
{{- end }}
{{- end }}
  replicas: {{ .Values.replicaCount }}
{{- if eq .Values.ledger.persistence.type "pvc" }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      {{- include "kartero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kartero.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.signoz.scrape .Values.podAnnotations }}
      annotations:
        {{- if .Values.signoz.scrape }}
        signoz.io/scrape: "true"
        signoz.io/port: {{ .Values.signoz.port | default .Values.service.port | quote }}
        signoz.io/path: {{ .Values.signoz.path | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kartero
          image: {{ include "kartero.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["run"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: KARTERO_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: KARTERO_LOG
              value: {{ .Values.logLevel | quote }}
            - name: KARTERO_INTERVAL
              value: {{ .Values.interval | quote }}
            - name: KARTERO_HEARTBEAT_INTERVAL
              value: {{ .Values.heartbeatInterval | quote }}
            - name: KARTERO_GITHUB_OWNER
              value: {{ .Values.github.owner | quote }}
            - name: KARTERO_GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: KARTERO_GITHUB_WORKFLOWS
              value: {{ join "," .Values.github.workflows | quote }}
            - name: KARTERO_TRUSTED_BRANCH
              value: {{ .Values.github.trustedBranch | quote }}
            - name: KARTERO_ARTIFACT_PREFIX
              value: {{ .Values.github.artifactPrefix | quote }}
            - name: KARTERO_OTLP_ENDPOINT
              value: {{ .Values.otlp.endpoint | quote }}
            - name: KARTERO_ALLOWLIST
              value: {{ printf "%s/allowlist.yaml" .Values.allowlist.mountPath | quote }}
            - name: KARTERO_LEDGER
              value: {{ .Values.ledger.path | quote }}
            - name: KARTERO_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "github.existingSecret is required" .Values.github.existingSecret | quote }}
                  key: {{ required "github.existingSecretKey is required" .Values.github.existingSecretKey | quote }}
                  optional: false
            {{- if .Values.archive.enabled }}
            {{- if not .Values.archive.bucket }}{{ fail "archive.bucket is required when archive.enabled is true" }}{{ end }}
            {{- if not .Values.archive.endpoint }}{{ fail "archive.endpoint is required when archive.enabled is true" }}{{ end }}
            {{- if not .Values.archive.existingSecret }}{{ fail "archive.existingSecret is required when archive.enabled is true" }}{{ end }}
            - name: KARTERO_ARCHIVE
              value: "true"
            - name: KARTERO_ARCHIVE_ARTIFACT_PREFIX
              value: {{ .Values.archive.artifactPrefix | quote }}
            - name: KARTERO_ARCHIVE_BUCKET
              value: {{ .Values.archive.bucket | quote }}
            - name: KARTERO_ARCHIVE_KEY_PREFIX
              value: {{ .Values.archive.keyPrefix | quote }}
            - name: KARTERO_ARCHIVE_ENDPOINT
              value: {{ .Values.archive.endpoint | quote }}
            - name: KARTERO_ARCHIVE_REGION
              value: {{ .Values.archive.region | quote }}
            - name: KARTERO_ARCHIVE_MAX_BYTES
              value: {{ .Values.archive.maxBytes | quote }}
            - name: KARTERO_ARCHIVE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.archive.existingSecret | quote }}
                  key: {{ .Values.archive.accessKeyIdKey | quote }}
                  optional: false
            - name: KARTERO_ARCHIVE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.archive.existingSecret | quote }}
                  key: {{ .Values.archive.secretAccessKeyKey | quote }}
                  optional: false
            {{- end }}
          volumeMounts:
            - name: allowlist
              mountPath: {{ .Values.allowlist.mountPath | quote }}
              readOnly: true
            - name: ledger
              mountPath: {{ .Values.ledger.persistence.mountPath | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: allowlist
          configMap:
            name: {{ include "kartero.fullname" . }}-allowlist
        - name: ledger
          {{- if eq .Values.ledger.persistence.type "ephemeral" }}
          emptyDir: {}
          {{- else if eq .Values.ledger.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "kartero.fullname" . }}
          {{- else }}
          {{- fail "ledger.persistence.type must be 'ephemeral' or 'pvc'" }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
