apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kartero.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kartero.labels" . | nindent 4 }}
spec:
{{- if eq .Values.ledger.persistence.type "pvc" }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "ledger.persistence.type=pvc is single-writer: replicaCount must be 1" }}
{{- end }}
{{- end }}
  replicas: {{ .Values.replicaCount }}
{{- if eq .Values.ledger.persistence.type "pvc" }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      {{- include "kartero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kartero.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The collector reads its configuration once, at startup. Without this
        # a changed allowlist or a newly configured source is written to the
        # ConfigMap, mounted, and never read — accepted, inert, and silent
        # about it. The checksum makes the pod template change with the
        # config, so Flux rolls the pod that has to read it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- if or .Values.signoz.scrape .Values.podAnnotations }}
        {{- if .Values.signoz.scrape }}
        signoz.io/scrape: "true"
        signoz.io/port: {{ .Values.signoz.port | default .Values.service.port | quote }}
        signoz.io/path: {{ .Values.signoz.path | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kartero
          image: {{ include "kartero.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["run"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: KARTERO_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.sources }}
            # KARTERO_CONFIG wins over every other setting, so the rest of the
            # collector's configuration comes from the rendered file instead.
            - name: KARTERO_CONFIG
              value: {{ printf "%s/kartero.yaml" .Values.config.mountPath | quote }}
            {{- else }}
            - name: KARTERO_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: KARTERO_INTERVAL
              value: {{ .Values.interval | quote }}
            - name: KARTERO_HEARTBEAT_INTERVAL
              value: {{ .Values.heartbeatInterval | quote }}
            - name: KARTERO_GITHUB_OWNER
              value: {{ .Values.github.owner | quote }}
            - name: KARTERO_GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: KARTERO_GITHUB_WORKFLOWS
              value: {{ join "," .Values.github.workflows | quote }}
            - name: KARTERO_TRUSTED_BRANCH
              value: {{ .Values.github.trustedBranch | quote }}
            - name: KARTERO_ARTIFACT_PREFIX
              value: {{ .Values.github.artifactPrefix | quote }}
            - name: KARTERO_OTLP_ENDPOINT
              value: {{ .Values.otlp.endpoint | quote }}
            - name: KARTERO_ALLOWLIST
              value: {{ printf "%s/allowlist.yaml" .Values.allowlist.mountPath | quote }}
            - name: KARTERO_LEDGER
              value: {{ .Values.ledger.path | quote }}
            - name: KARTERO_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "github.existingSecret is required" .Values.github.existingSecret | quote }}
                  key: {{ required "github.existingSecretKey is required" .Values.github.existingSecretKey | quote }}
                  optional: false
            {{- end }}
            {{- if .Values.archive.enabled }}
            {{- if not .Values.archive.path }}{{ fail "archive.path is required when archive.enabled is true" }}{{ end }}
            {{- if and (eq .Values.archive.persistence.type "pvc") (gt (int .Values.replicaCount) 1) }}
            {{- fail "archive.persistence.type=pvc is single-writer: replicaCount must be 1" }}
            {{- end }}
            {{- if not .Values.sources }}
            - name: KARTERO_ARCHIVE
              value: "true"
            - name: KARTERO_ARCHIVE_ARTIFACT_PREFIX
              value: {{ .Values.archive.artifactPrefix | quote }}
            - name: KARTERO_ARCHIVE_DIR
              value: {{ .Values.archive.path | quote }}
            - name: KARTERO_ARCHIVE_MAX_BYTES
              value: {{ .Values.archive.maxBytes | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: allowlist
              mountPath: {{ .Values.allowlist.mountPath | quote }}
              readOnly: true
            {{- if .Values.sources }}
            - name: config
              mountPath: {{ .Values.config.mountPath | quote }}
              readOnly: true
            {{- range $index, $source := .Values.sources }}
            - name: {{ printf "source-token-%d" $index }}
              mountPath: {{ printf "/etc/kartero/tokens/%d" $index | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: ledger
              mountPath: {{ .Values.ledger.persistence.mountPath | quote }}
            {{- if .Values.archive.enabled }}
            - name: archive
              mountPath: {{ .Values.archive.path | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: allowlist
          configMap:
            name: {{ include "kartero.fullname" . }}-allowlist
        {{- if .Values.sources }}
        - name: config
          configMap:
            name: {{ include "kartero.fullname" . }}-config
        {{- range $index, $source := .Values.sources }}
        - name: {{ printf "source-token-%d" $index }}
          secret:
            secretName: {{ required "each source needs existingSecret" $source.existingSecret | quote }}
            optional: false
        {{- end }}
        {{- end }}
        - name: ledger
          {{- if eq .Values.ledger.persistence.type "ephemeral" }}
          emptyDir: {}
          {{- else if eq .Values.ledger.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "kartero.fullname" . }}
          {{- else }}
          {{- fail "ledger.persistence.type must be 'ephemeral' or 'pvc'" }}
          {{- end }}
        {{- if .Values.archive.enabled }}
        - name: archive
          {{- if eq .Values.archive.persistence.type "ephemeral" }}
          emptyDir: {}
          {{- else if eq .Values.archive.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "kartero.fullname" . }}-archive
          {{- else }}
          {{- fail "archive.persistence.type must be 'ephemeral' or 'pvc'" }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
