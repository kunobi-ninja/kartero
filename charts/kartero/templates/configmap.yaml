apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kartero.fullname" . }}-allowlist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kartero.labels" . | nindent 4 }}
data:
  # The reviewed registry for this deployment, not for Kartero.
  #
  # What a deployment collects is its own business: the names in it belong to
  # the repositories it watches, and adding a bench or a metric there should
  # not need a release here. The file shipped with the chart is an example and
  # the fallback, so an installation that sets nothing still starts.
  allowlist.yaml: |
{{ .Values.allowlist.content | default (.Files.Get "allowlist.yaml") | indent 4 }}
{{- if .Values.sources }}
---
# Several sources cannot be described by environment variables: each one has
# its own token, branch and workflow list, and a flat namespace has no way to
# say which value belongs to which repository without inventing an index
# convention. With `sources` set the collector reads this file instead, and
# every environment variable below KARTERO_CONFIG stops being consulted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kartero.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kartero.labels" . | nindent 4 }}
data:
  kartero.yaml: |
    bind: "0.0.0.0:{{ .Values.service.port }}"
    interval: {{ .Values.interval | quote }}
    heartbeat_interval: {{ .Values.heartbeatInterval | quote }}
    lookback: {{ .Values.lookback | default "24h" | quote }}
    artifact_prefix: {{ .Values.github.artifactPrefix | quote }}
    otlp:
      endpoint: {{ .Values.otlp.endpoint | quote }}
      {{- with .Values.otlp.readinessUrl }}
      # Nothing is delivered while this answers anything but 2xx.
      readiness_url: {{ . | quote }}
      {{- end }}
    allowlist: {{ printf "%s/allowlist.yaml" .Values.allowlist.mountPath | quote }}
    ledger: {{ .Values.ledger.path | quote }}
    sources:
    {{- range $index, $source := .Values.sources }}
      - owner: {{ required "each source needs an owner" $source.owner | quote }}
        repo: {{ required "each source needs a repo" $source.repo | quote }}
        trusted_branch: {{ $source.trustedBranch | default "main" | quote }}
        token_file: {{ printf "/etc/kartero/tokens/%d/%s" $index (required "each source needs existingSecretKey" $source.existingSecretKey) | quote }}
        workflows:
        {{- range (required "each source needs at least one workflow" $source.workflows) }}
          - {{ . | quote }}
        {{- end }}
        {{- with $source.actions }}
        # Deriving metrics from this source's runs. Absent means the source is
        # only read for artifacts, which is what every source did before this.
        actions:
          gate_job: {{ required "actions needs a gateJob" .gateJob | quote }}
          guard_job: {{ required "actions needs a guardJob" .guardJob | quote }}
          guard_step: {{ required "actions needs a guardStep" .guardStep | quote }}
          filter_job: {{ required "actions needs a filterJob" .filterJob | quote }}
          docs_job: {{ required "actions needs a docsJob" .docsJob | quote }}
          branch_classes:
            {{- range $branch, $class := .branchClasses }}
            {{ $branch | quote }}: {{ $class | quote }}
            {{- end }}
          job_aliases:
            {{- range $from, $to := .jobAliases }}
            {{ $from | quote }}: {{ $to | quote }}
            {{- end }}
          canonical_jobs:
            {{- range .canonicalJobs }}
            - {{ . | quote }}
            {{- end }}
          excluded_workflows:
            {{- range .excludedWorkflows }}
            - {{ . | quote }}
            {{- end }}
          {{- with .jobNamesArtifact }}
          # Set, and the two lists above come from this artifact, uploaded by
          # the source repository's own trusted runs, instead of from here. A
          # job rename is then covered by the pull request that makes it.
          #
          # An artifact rather than a path in the repository: reading a file
          # out of a private repository needs `contents: read`, the whole
          # source tree, where artifacts need only the `actions: read` this
          # collector already has.
          job_names_artifact: {{ . | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.archive.enabled }}
    archive:
      enabled: true
      artifact_prefix: {{ .Values.archive.artifactPrefix | quote }}
      dir: {{ .Values.archive.path | quote }}
      max_bytes: {{ .Values.archive.maxBytes | int64 }}
      {{- with .Values.archive.retentionDays }}
      # Days an archived file is kept. Without it the volume grows without a
      # horizon, and the pass that fails when it is full is the one that would
      # have archived that night's run.
      retention_days: {{ . | int64 }}
      {{- end }}
    {{- end }}
    {{- if .Values.export.enabled }}
    {{- if not .Values.export.jobs }}{{ fail "export.enabled needs at least one export.jobs entry" }}{{ end }}
    export:
      enabled: true
      signoz:
        endpoint: {{ required "export.signoz.endpoint is required" .Values.export.signoz.endpoint | quote }}
        api_key_file: {{ printf "/etc/kartero/export/signoz/%s" (required "export.signoz.existingSecretKey is required" .Values.export.signoz.existingSecretKey) | quote }}
      store:
        endpoint: {{ required "export.store.endpoint is required" .Values.export.store.endpoint | quote }}
        bucket: {{ required "export.store.bucket is required" .Values.export.store.bucket | quote }}
        region: {{ .Values.export.store.region | default "auto" | quote }}
        access_key_id_file: {{ printf "/etc/kartero/export/store/%s" (required "export.store.accessKeyIdKey is required" .Values.export.store.accessKeyIdKey) | quote }}
        secret_access_key_file: {{ printf "/etc/kartero/export/store/%s" (required "export.store.secretAccessKeyKey is required" .Values.export.store.secretAccessKeyKey) | quote }}
      jobs:
      {{- range .Values.export.jobs }}
        - name: {{ required "each export job needs a name" .name | quote }}
          key: {{ required "each export job needs a key" .key | quote }}
          {{- with .snapshotKey }}
          snapshot_key: {{ . | quote }}
          {{- end }}
          window: {{ required "each export job needs a window" .window | quote }}
          step: {{ required "each export job needs a step" .step | quote }}
          include_partial: {{ .includePartial | default false }}
          {{- with .cacheControl }}
          cache_control: {{ . | quote }}
          {{- end }}
          queries:
          {{- range (required "each export job needs queries" .queries) }}
            # A SigNoz v5 builder query, passed through as written.
            - id: {{ required "each export query needs an id" .id | quote }}
              spec: {{ required "each export query needs a spec" .spec | toJson }}
          {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
